<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>筋トレ</title>
  <!-- iPhoneの「ホーム画面に追加」で使われるアイコンと名前 -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <meta name="apple-mobile-web-app-title" content="筋トレ">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <style>
    :root { --bg: #ffffff; --fg: #37352f; --muted: #787774; }
    @media (prefers-color-scheme: dark) { :root { --bg: #191919; --fg: #e3e3e1; --muted: #9b9b9b; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
      font-family: ui-sans-serif, -apple-system, "Hiragino Sans", sans-serif; }
    .box { text-align: center; padding: 16px; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    p { color: var(--muted); font-size: 14px; }
    a { color: var(--fg); }
  </style>
</head>
<body>
  <div class="box">
    <img src="apple-touch-icon.png" alt="">
    <p id="msg">筋トレアプリを開いています…</p>
    <p><a id="go" href="#">筋トレアプリを開く</a></p>
    <p id="how" hidden>ホーム画面に置くには：共有ボタン →「ホーム画面に追加」</p>
  </div>
  <script>
    // 入口ページ：アイコンを出すためだけのページ。開いたらすぐGASの本番アプリへ移る
    var APP_URL = 'https://script.google.com/macros/s/AKfycbwe2tn7QAqEK4jewPdzgUhTQpF2RadL7meeNnHLTwWZ3m-kWHE_Oby-iPyBKeN0Krer/exec?env=prod';
    document.getElementById('go').href = APP_URL;
    // ホーム画面のアイコンから開いたとき（standalone）だけ、すぐアプリへ移る。
    // Safariで開いたときは移らずに「ホーム画面に追加」の案内を出す（追加する前に移ってしまわないように）
    if (navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
      location.replace(APP_URL);
    } else {
      document.getElementById('msg').textContent = '筋トレアプリの入口です';
      document.getElementById('how').hidden = false;
    }
  </script>
</body>
</html>
